{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexushr.fullname" . }}-redis
  labels:
    app: {{ include "nexushr.name" . }}
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "nexushr.name" . }}
      component: redis
  template:
    metadata:
      labels:
        app: {{ include "nexushr.name" . }}
        component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: {{ .Values.redis.port }}
              name: redis
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexushr.fullname" . }}-redis
  labels:
    app: {{ include "nexushr.name" . }}
    component: redis
spec:
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: redis
  selector:
    app: {{ include "nexushr.name" . }}
    component: redis
{{- end }}
